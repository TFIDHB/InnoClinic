services:
  mongodb:
    image: mongo:latest
    container_name: offices_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
        test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 10

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=AppointmentsDb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck

  offices.api:
    image: ${DOCKER_REGISTRY-}officesapi
    build:
      context: .
      dockerfile: src/Offices.API/Offices.API.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OfficesConnection=mongodb://mongodb:27017
    depends_on:
      - mongodb

  innoclinic.services.api:
    image: ${DOCKER_REGISTRY-}innoclinicservicesapi
    build:
      context: .
      dockerfile: src/Services.API/Services.API.API/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ServicesConnection=${SERVICES_CONNECTION}
      - AppointmentsApi__BaseUrl=http://innoclinic.appointments.api:8080
    depends_on:
      - sqlserver

  innoclinic.appointments.api:
    image: ${DOCKER_REGISTRY-}innoclinicappointmentsapi
    build:
      context: .
      dockerfile: src/Appointments.API/Appointments.API.API/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AppointmentsConnection=${APPOINTMENTS_CONNECTION}
      - ServicesApi__BaseUrl=http://innoclinic.services.api:8080
      - ProfilesApi__BaseUrl=http://innoclinic.profiles.api:8080
      - DocumentsApi__BaseUrl=http://innoclinic.documents.api:8080
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=InnoClinic.Auth.API
      - JwtSettings__Audience=InnoClinic.Clients
      - JwtSettings__ExpirationMinutes=5
    depends_on:
      - postgres

  innoclinic.documents.api:
    image: ${DOCKER_REGISTRY-}innoclinicdocumentsapi
    build:
      context: .
      dockerfile: src/Documents.API/Documents.API.API/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DocumentsConnection=${DOCUMENTS_CONNECTION}
      - ConnectionStrings__BlobStorage=${DOCUMENTS_BLOB_CONNECTION}
    depends_on:
      - azurite
      - sqlserver

  innoclinic.auth.api:
    image: ${DOCKER_REGISTRY-}innoclinicauthapi
    build:
      context: .
      dockerfile: src/Auth.API/Auth.API.API/Dockerfile
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AuthConnection=${AUTH_CONNECTION}
      - ProfilesApi__BaseUrl=http://innoclinic.profiles.api:8080
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=InnoClinic.Auth.API
      - JwtSettings__Audience=InnoClinic.Clients
      - JwtSettings__ExpirationMinutes=5
    depends_on:
        sqlserver:
            condition: service_healthy

  innoclinic.profiles.api:
    image: ${DOCKER_REGISTRY-}innoclinicprofilesapi
    build:
      context: .
      dockerfile: src/Profiles.API/InnoClinic.Profiles.API/Dockerfile
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ProfilesConnection=${PROFILES_CONNECTION}
      - AuthApi__BaseUrl=http://innoclinic.auth.api:8080
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=InnoClinic.Auth.API
      - JwtSettings__Audience=InnoClinic.Clients
      - JwtSettings__ExpirationMinutes=5
    depends_on:
        sqlserver:
            condition: service_healthy

volumes:
  mongo_data:
  sqlserver_data:
  postgres_data:
  azurite_data: