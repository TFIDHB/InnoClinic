services:
  mongodb:
    image: mongo:latest
    container_name: offices_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

  offices.api:
    image: ${DOCKER_REGISTRY-}officesapi
    build:
      context: .
      dockerfile: src/Offices.API/Offices.API.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OfficesConnection=mongodb://mongodb:27017
    depends_on:
     - mongodb

  innoclinic.documents.api:
    image: ${DOCKER_REGISTRY-}innoclinicdocumentsapi
    build:
      context: .
      dockerfile: src/Documents.API/Documents.API.API/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__;
      - AzureBlobStorage__;
    depends_on:
      - azurite
      - sqlserver

volumes:
  mongo_data:
  azurite_data:

