services:
  mongodb:
    image: mongo:latest
    container_name: offices_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=AppointmentsDb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  offices.api:
    image: ${DOCKER_REGISTRY-}officesapi
    build:
      context: .
      dockerfile: src/Offices.API/Offices.API.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OfficesConnection=mongodb://mongodb:27017
    depends_on:
      - mongodb

  innoclinic.services.api:
    image: ${DOCKER_REGISTRY-}innoclinicservicesapi
    build:
      context: .
      dockerfile: src/Services.API/Services.API.API/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ServicesConnection=${SERVICES_CONNECTION}
      - AppointmentsApi__BaseUrl=http://innoclinic.appointments.api:8080
    depends_on:
      - sqlserver

  innoclinic.appointments.api:
    image: ${DOCKER_REGISTRY-}innoclinicappointmentsapi
    build:
      context: .
      dockerfile: src/Appointments.API/Appointments.API.API/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AppointmentsConnection=${APPOINTMENTS_CONNECTION}
      - ServicesApi__BaseUrl=http://innoclinic.services.api:8080
    depends_on:
      - postgres

volumes:
  mongo_data:
  sqlserver_data:
  postgres_data: